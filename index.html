<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareLink – Online Doctor Visits</title>
<style>
:root{--bg:#f2f7f6;--card:#fff;--ink:#12302b;--muted:#5e7772;--accent:#0b7a69;--danger:#c2410c;--line:#d5e3e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
.emerg{background:#fff1e6;color:#7a2e00;text-align:center;padding:8px 12px;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
header b{font-size:1.25rem;color:var(--accent)}
main{max-width:900px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
h2{margin:18px 0 6px;font-size:1.25rem}h3{margin:0 0 4px;font-size:1.05rem}
.muted{color:var(--muted);font-size:.92rem}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:.92rem}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
button{font:inherit;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;margin:4px 6px 4px 0}
button.p{background:var(--accent);border-color:var(--accent);color:#fff}
button.d{color:var(--danger);border-color:var(--danger)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7fd1c3;outline-offset:2px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:#e3f3ef;color:var(--accent);font-size:.82rem}
.err{color:var(--danger);margin:8px 0}.ok{color:var(--accent);margin:8px 0}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}
.chk{display:flex;gap:8px;align-items:flex-start;font-weight:400}.chk input{width:auto;margin-top:5px}
.stage{position:relative;background:#000;border-radius:12px;aspect-ratio:16/9;overflow:hidden}
#remote{width:100%;height:100%;object-fit:cover}
#local{position:absolute;right:10px;bottom:10px;width:24%;border-radius:8px;border:2px solid #fff;transform:scaleX(-1)}
#wait{position:absolute;inset:0;display:grid;place-items:center;color:#9bb;text-align:center;padding:16px}
</style>
</head>
<body>
<div class="emerg">CareLink is not for emergencies. If this is urgent, go to the nearest hospital or call your local emergency number.</div>
<header><b>CareLink</b><span id="who"></span></header>
<main id="root"></main>
<script src="/app.js"></script>
</body>
</html>
